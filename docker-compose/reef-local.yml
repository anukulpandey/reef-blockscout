version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  rpc-proxy:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./services/rpc-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - db
      - redis-db
      - rpc-proxy
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 9.0.2
    links:
      - db:database
    environment:
      ETHEREUM_JSONRPC_HTTP_URL: http://rpc-proxy:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://rpc-proxy:8545/
      CHAIN_ID: '13939'
      COIN_NAME: Reef
      COIN: REEF
      FIRST_BLOCK: '0'

  nft_media_handler:
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 9.0.2

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    environment:
      NEXT_PUBLIC_API_HOST: ${BLOCKSCOUT_PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_STATS_API_HOST: http://${BLOCKSCOUT_PUBLIC_HOST:-localhost}:8080
      NEXT_PUBLIC_NETWORK_NAME: Reef Local
      NEXT_PUBLIC_NETWORK_SHORT_NAME: Reef Local
      NEXT_PUBLIC_NETWORK_ID: '13939'
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Reef
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: REEF
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: '18'
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_APP_HOST: ${BLOCKSCOUT_PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "['daily_txs']"
      NEXT_PUBLIC_VISUALIZE_API_HOST: http://${BLOCKSCOUT_PUBLIC_HOST:-localhost}:8081
      NEXT_PUBLIC_IS_TESTNET: 'true'
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
