version: '3.9'

services:
  redis-db:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256m
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockscout}
      POSTGRES_USER: ${POSTGRES_USER:-blockscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockscout} -d ${POSTGRES_DB:-blockscout}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/blockscout/${DOCKER_REPO:-blockscout}:${DOCKER_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockscout}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-blockscout}
      ECTO_USE_SSL: ${ECTO_USE_SSL:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-this-in-production}
      ETHEREUM_JSONRPC_VARIANT: ${ETHEREUM_JSONRPC_VARIANT:-geth}
      ETHEREUM_JSONRPC_TRANSPORT: http
      ETHEREUM_JSONRPC_HTTP_URL: ${ETHEREUM_JSONRPC_HTTP_URL:-http://eth.reef-node-reefdevcluster-808c46-72-60-35-83.sslip.io/}
      ETHEREUM_JSONRPC_TRACE_URL: ${ETHEREUM_JSONRPC_TRACE_URL:-http://eth.reef-node-reefdevcluster-808c46-72-60-35-83.sslip.io/}
      ETHEREUM_JSONRPC_WS_URL: ${ETHEREUM_JSONRPC_WS_URL:-}
      CHAIN_ID: ${CHAIN_ID:-13939}
      COIN: ${COIN:-REEF}
      COIN_NAME: ${COIN_NAME:-Reef}
      NETWORK: ${NETWORK:-Reef}
      SUBNETWORK: ${SUBNETWORK:-Mainnet}
      PORT: 4000
      DISABLE_MARKET: "true"
      DISABLE_INDEXER: ${DISABLE_INDEXER:-false}
      DISABLE_REALTIME_INDEXER: ${DISABLE_REALTIME_INDEXER:-true}
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: ${INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER:-true}
      API_V1_READ_METHODS_DISABLED: "false"
      API_V1_WRITE_METHODS_DISABLED: "false"
      ADMIN_PANEL_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - logs-data:/app/logs
      - dets-data:/app/dets

volumes:
  db-data:
  redis-data:
  logs-data:
  dets-data:
